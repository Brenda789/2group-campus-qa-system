# ========== 应用配置 ==========
spring.application.name=campus-qa
server.port=8000

# ========== MySQL 8.0 数据源 ==========
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/campus_qa?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}

# ========== MyBatis-Plus ==========
# 注意：Mapper 全部继承 BaseMapper，无需 XML 文件，故不配置 mapper-locations
mybatis-plus.type-aliases-package=com.hhu.campusqa.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ========== JWT ==========
jwt.secret=campus-qa-hhu-2026-jwt-secret-key-must-be-long-enough
jwt.expiration=86400000

# ========== 文件上传 ==========
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads
