# ========== 应用配置 ==========
spring.application.name=campus-qa
server.port=8000

# ========== MySQL 8.0 数据源（添加驱动类名，避免自动检测失败） ==========
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/campus_qa?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=17669453262lyj

# ========== MyBatis 配置 ==========
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.hhu.campusqa.entity
mybatis.configuration.map-underscore-to-camel-case=true

# ========== JWT 配置 ==========
jwt.secret=campus-qa-hhu-2026-jwt-secret-key-must-be-long-enough
jwt.expiration=86400000

# ========== 文件上传限制 ==========
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads
